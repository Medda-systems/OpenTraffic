<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac app · OpenTraffic</title>
<!-- OpenTraffic Mac app viewer, served at / by the mirror server. Protocol: docs/macapp-mirror-protocol.md -->
<link rel="stylesheet" href="/__opentraffic/macapp/viewer.css">
<script src="/__opentraffic/macapp/viewer.js" defer></script>
</head>
<body data-appearance="light">
<div class="otm-bar" id="otm-bar" data-opentraffic-ui title="A shared Mac app. It runs on the host's Mac; you see its window and can click and type in it.">
  <span class="otm-dot" id="otm-dot" title="Connecting to the app…"></span>
  <img class="otm-icon" id="otm-icon" alt="" hidden>
  <span class="otm-name" id="otm-name">Mac app</span>
  <span class="otm-tag">· Mac app · running on the host's Mac</span>
  <span class="otm-views" role="group" aria-label="View">
    <button type="button" class="otm-view" id="otm-view-window" data-view="window" data-opentraffic-ui aria-pressed="true" aria-label="Window view" title="Window view: the app's real window"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 5.5h13" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button type="button" class="otm-view" id="otm-view-simple" data-view="simple" data-opentraffic-ui aria-pressed="false" aria-label="Simple view" title="Simple view: the window as a page you can read and tap, for small screens"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </span>
</div>
<div class="otm-banner" id="otm-banner" role="status" aria-live="polite" data-opentraffic-ui hidden></div>
<main class="otm-desk" id="otm-desk">
  <div class="otm-fit" id="otm-fit"><div class="otm-stage" id="otm-stage"></div></div>
</main>
<main class="otm-simple" id="otm-simple" hidden>
  <div class="otm-s-live" data-opentraffic-ui title="The app's real window, live">
    <canvas class="otm-thumb" id="otm-thumb" width="1" height="1" aria-hidden="true"></canvas>
    <div class="otm-s-caption"><b id="otm-s-title">Mac app</b><span>Live from the host's Mac</span></div>
  </div>
  <div class="otm-s-windows" id="otm-s-windows"></div>
</main>
<noscript>This shared Mac app needs JavaScript to show its window.</noscript>
</body>
</html>
